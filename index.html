<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5x5 바둑 - 책과 함께 두기</title>
<style>
  :root { --bg: #f5f3ee; --fg: #1e1e1e; --muted: #6e6e6e; --line: #d8d4ca; --accent: #1e6ee6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .boardbox { flex: 1 1 420px; max-width: 620px; min-width: 280px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 4px; touch-action: manipulation; cursor: pointer; }
  .panel { flex: 1 1 300px; min-width: 280px; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .book { min-height: 3em; white-space: pre-line; }
  .label { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .last { min-height: 3.2em; white-space: pre-line; }
  .legend { list-style: none; padding: 0; margin: 12px 0 6px; font-size: 13px; }
  .legend li { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend canvas { width: 56px; height: 26px; flex: none; cursor: default; }
  .moves { font-size: 13px; min-height: 4.5em; word-spacing: 4px; }
  .controls { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-size: 15px; padding: 7px 16px; border: 1px solid #b9b4a8; border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover { background: #eeeae0; }
  button:disabled { color: #aaa; cursor: default; background: #f1efe9; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 15px; width: 100%; margin-top: 4px; cursor: pointer; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .err { color: #b00020; white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap">
  <div class="boardbox"><canvas id="board" width="620" height="620" aria-label="바둑판"></canvas></div>
  <div class="panel">
    <h1 id="turn">불러오는 중…</h1>
    <div class="book" id="book"></div>
    <div class="label" id="lastLabel"></div>
    <div class="last" id="last"></div>
    <ul class="legend">
      <li><canvas id="lg0" width="112" height="52"></canvas>증명된 최선의 수</li>
      <li><canvas id="lg1" width="112" height="52"></canvas>증명되지 않은 수</li>
      <li><canvas id="lg3" width="112" height="52"></canvas>증명되지 않은 수 (다음 수는 판정됨)</li>
      <li><canvas id="lg2" width="112" height="52"></canvas>값을 잃는 수 (증명됨)</li>
    </ul>
    <div class="label">수순 ( ? 증명 안 됨, × 값을 잃음 )</div>
    <div class="moves" id="moves"></div>
    <div class="controls">
      <button id="btnNew">새 판</button>
      <button id="btnUndo" title="← 또는 백스페이스">무르기 (←)</button>
      <button id="btnPass">패스</button>
      <label class="chk"><input type="checkbox" id="chkPrev" checked> 미리보기 (빈 점에 판정 색 표시)</label>
    </div>
    <div class="note">
      흑과 백을 모두 직접 둡니다. 책(논문 수순)과 solver가 증명해 둔 결과에 있는 국면만 판정합니다.<br>
      미리보기에서 점이 없는 빈 점은 증명된 최선의 수입니다.<br>
      규칙: 중국식 계가, 덤 없음, 자살수 금지, 같은 판 모양 반복 금지, 2연속 패스로 종국.
      <div id="stat"></div>
    </div>
  </div>
</div>
<script src="go5core.js"></script>
<script>
(function () {
  'use strict';
  const G = Go5, $ = (id) => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');
  const book = new G.Book(); let game = null, illegalMsg = '';
  const MARK = { 1: '#e12828', 2: '#1eaa3c', 3: '#fa9600' };       // 증명 안 됨 / 값을 잃음 / 증명 안 됨(다음 수 판정됨)

  // 판의 치수 (캔버스 안쪽 좌표 620 x 620 기준)
  const S = 620, M = 80, CELL = (S - 2 * M) / 4;
  const px = (p) => M + (p % 5) * CELL, py = (p) => M + (4 - Math.floor(p / 5)) * CELL;

  function drawStone(c, x, y, rad, black, cls, last) {
    if (cls !== G.CLS_BEST) rad *= 0.90;
    c.save();
    if (cls === G.CLS_BEST) {
      c.beginPath(); c.arc(x + rad * 0.07, y + rad * 0.09, rad, 0, 7); c.fillStyle = 'rgba(0,0,0,.28)'; c.fill();
      const g = c.createRadialGradient(x - rad * 0.35, y - rad * 0.35, rad * 0.05, x, y, rad);
      g.addColorStop(0, black ? '#6e6e6e' : '#ffffff'); g.addColorStop(1, black ? '#0a0a0a' : '#cdcdc8');
      c.beginPath(); c.arc(x, y, rad, 0, 7); c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1, rad * 0.03); c.strokeStyle = black ? '#000' : '#787878'; c.stroke();
    } else {
      c.beginPath(); c.arc(x, y, rad, 0, 7); c.fillStyle = black ? '#3e3e42' : '#ece8de'; c.fill();
      c.lineWidth = Math.max(1, rad * 0.035); c.strokeStyle = black ? '#141414' : '#787878';
      if (rad > 20) c.setLineDash([rad * 0.13, rad * 0.09]);
      c.stroke(); c.setLineDash([]);
      const m = rad * 0.20;
      c.beginPath(); c.arc(x, y, m, 0, 7); c.fillStyle = MARK[cls]; c.fill();
      c.lineWidth = 1; c.strokeStyle = black ? '#fff' : '#3c3c3c'; c.stroke();
    }
    if (last) { c.beginPath(); c.arc(x, y, rad + 5, 0, 7); c.lineWidth = 2.5; c.strokeStyle = '#1e6ee6'; c.stroke(); }
    c.restore();
  }

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3), w = cv.clientWidth || S;
    if (cv.width !== Math.round(w * dpr)) { cv.width = cv.height = Math.round(w * dpr); }
    ctx.setTransform(cv.width / S, 0, 0, cv.width / S, 0, 0);
    ctx.fillStyle = '#deb878'; ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = '#3c2814'; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      ctx.moveTo(M, M + i * CELL); ctx.lineTo(M + 4 * CELL, M + i * CELL);
      ctx.moveTo(M + i * CELL, M); ctx.lineTo(M + i * CELL, M + 4 * CELL);
    }
    ctx.stroke();
    ctx.fillStyle = '#3c2814'; ctx.beginPath(); ctx.arc(px(12), py(12), 4, 0, 7); ctx.fill();
    ctx.font = 'bold 16px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 5; i++) {
      ctx.fillText('abcde'[i], M + i * CELL, M + 4 * CELL + 62);
      ctx.fillText(String(i + 1), M - 62, M + (4 - i) * CELL);
    }
    if (!game) return;
    const st = game.st, black = st.stm === 0 ? st.own : st.opp, white = st.stm === 0 ? st.opp : st.own, last = game.last();
    for (let p = 0; p < 25; p++) {
      const b = black >> p & 1, wh = white >> p & 1;
      if (!b && !wh) continue;
      const idx = last ? last.stoneOf[p] : -1;
      drawStone(ctx, px(p), py(p), CELL * 0.43, !!b, idx >= 0 ? G.drawCls(game.recs[idx]) : G.CLS_BEST, idx >= 0 && idx === game.recs.length - 1);
    }
    if ($('chkPrev').checked && !game.over) {
      const pv = game.preview();
      for (let p = 0; p < 25; p++) {
        if (pv[p] <= G.CLS_BEST) continue;
        ctx.beginPath(); ctx.arc(px(p), py(p), 9, 0, 7); ctx.fillStyle = MARK[pv[p]]; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
    }
  }

  function refresh() {
    draw();
    if (!game) return;
    const st = game.st, last = game.last();
    $('turn').textContent = game.over ? '종국: ' + G.wonText(G.finalScoreBlack(st))
      : (st.stm === 0 ? '흑' : '백') + ' 차례' + (game.recs.length ? '  (' + (game.recs.length + 1) + '수째)' : '');
    let b = '';
    if (!game.over) {
      const k = book.lookupKnown(st, game.hist), v = game.curKnown();
      if (k.kind) b = '책: 최선으로 두면 ' + G.wonText(k.v) + '\n[' + k.src + ']' + (k.mv === G.NOMOVE ? ' (다음 수는 책에 없음)' : '');
      else if (v !== null) b = '책: 최선으로 두면 ' + G.wonText(v) + '\n[solver 증명] (다음 수는 아직 모름)';
      else b = '책에 없는 국면입니다.\n(값이 증명되지 않음)';
    }
    $('book').textContent = b;
    $('lastLabel').textContent = last && !illegalMsg ? '마지막 수' : '';
    $('last').textContent = illegalMsg || (last ? G.describeMove(last) : '');
    $('moves').textContent = game.recs.map((r, i) => (i + 1) + '.' + G.mvName(r.mv) + (r.cls === G.CLS_UNPROVEN ? '?' : r.cls === G.CLS_MISTAKE ? '×' : '')).join('  ');
    $('btnUndo').disabled = !game.recs.length; $('btnPass').disabled = game.over;
  }
  function move(mv) {
    if (!game || game.over) return;
    illegalMsg = game.push(mv) ? '' : '둘 수 없는 자리입니다\n(자살수이거나 같은 모양의 반복)';
    refresh();
  }
  function undo() { if (game) { game.undo(); illegalMsg = ''; refresh(); } }

  cv.addEventListener('click', (e) => {
    const rc = cv.getBoundingClientRect(), x = (e.clientX - rc.left) * S / rc.width, y = (e.clientY - rc.top) * S / rc.height;
    const c = Math.round((x - M) / CELL), r = Math.round((y - M) / CELL);
    if (c < 0 || c > 4 || r < 0 || r > 4) return;
    if (Math.hypot(x - (M + c * CELL), y - (M + r * CELL)) > CELL * 0.5) return;
    const p = (4 - r) * 5 + c;
    if (game && ((game.st.own | game.st.opp) >> p & 1)) return;
    move(p);
  });
  $('btnNew').onclick = () => { if (game) { game.reset(); illegalMsg = ''; refresh(); } };
  $('btnUndo').onclick = undo;
  $('btnPass').onclick = () => move(G.PASS);
  $('chkPrev').onchange = refresh;
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); undo(); }
  });
  window.addEventListener('resize', draw);

  for (const [id, cls] of [['lg0', 0], ['lg1', 1], ['lg3', 3], ['lg2', 2]]) {
    const c = $(id).getContext('2d');
    drawStone(c, 26, 26, 22, true, cls, false); drawStone(c, 84, 26, 22, false, cls, false);
  }
  draw();
  const get = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(u + ' (' + r.status + ')'); return r.text(); });
  Promise.all([get('go5_book.txt'), get('go5_results.txt')]).then(([b, r]) => {
    book.loadPaperBook(b); book.loadResults(r);
    game = new G.Game(book);
    // 주소 뒤에 ?moves=b3,c3,c4 처럼 수순을 붙이면 그 국면에서 시작한다
    const q = new URLSearchParams(location.search).get('moves');
    if (q) for (const t of q.split(/[\s,]+/)) { const m = G.parseMove(t.toLowerCase()); if (m < 0 || !game.push(m)) break; }
    $('stat').textContent = '책 ' + book.paperBook.size + '국면, solver 증명 ' + book.resDb.size + '개';
    refresh();
  }).catch((e) => {
    $('turn').textContent = '책을 불러오지 못했습니다';
    $('book').innerHTML = '<span class="err"></span>';
    $('book').firstChild.textContent = String(e.message || e) + '\n이 페이지는 웹 서버(예: GitHub Pages)에서 열어야 합니다. 파일을 직접 열면 책 파일을 읽을 수 없습니다.';
  });
})();
</script>
</body>
</html>
